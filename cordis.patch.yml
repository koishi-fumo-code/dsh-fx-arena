# ============================================================================
# dsh-fx-arena —— 插件自带的挂载声明（bundle patch）
# ============================================================================
# 这个文件是**包的一部分**：装进 profile 的 `dsh.profile.bundles` 后，启动时按
#   「bundle 顺序 → profile 自己的 cordis.patch.yml → --patch」
# 叠进插件树。
#
# ⭐ 入口（insert）写在这里，是为了**卸载干净**：插件管理器卸载时只清
#   「包自带 patch 里的行」，绝不改写用户的 cordis.patch.yml。
#   所以别把这段抄进 profile 的 patch 里（重复挂载会让卸载 409 拒绝）。
#
# 装/卸：见 README.md（登记包名 + 重启一次 DSH）。
# ============================================================================

- insert:
    - id: fx-arena
      name: dsh-fx-arena
